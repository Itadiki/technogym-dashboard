name: Build Android APK

on:
  push:
    branches: [main, android-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK (arm64 phones)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk technogym-dashboard.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: technogym-dashboard-apk
          path: technogym-dashboard.apk

      - name: Publish APK as a GitHub release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Technogym Dashboard APK (build ${{ github.run_number }})
          body: Download technogym-dashboard.apk below and open it on your Android phone.
          files: technogym-dashboard.apk
